name: build

# Every push to main: build the CUDA image, push it to ghcr.io, and publish the binaries as a GitHub release.
# Tags v*: the same, with the version as image tag. Pull requests: build only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/llamacpp-inkling2mini

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint the shell scripts
        run: |
          shellcheck -x docker/start-server.sh scripts/*.sh host/*.sh
          python3 -m py_compile scripts/*.py

      - name: Free disk space for the CUDA toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=llamacpp-inkling2mini
            org.opencontainers.image.description=llama.cpp for Inkling 2 Mini on one NVIDIA GPU (RTX 3090): vision, up to ~575K context
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            CUDA_ARCH=86;89
            BUILD_JOBS=4
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the binaries from the image
        run: |
          short=$(git rev-parse --short HEAD)
          name=llamacpp-inkling2mini-${short}-linux-x64-cuda12.8
          docker pull "${IMAGE}@${{ needs.image.outputs.digest }}"
          id=$(docker create "${IMAGE}@${{ needs.image.outputs.digest }}")
          docker cp "$id:/app" "$name"
          docker rm "$id"
          cp README.md "$name/README-llamacpp-inkling2mini.md"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "SHORT=$short" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME}
          else
            tag=build-${GITHUB_RUN_NUMBER}-${SHORT}
          fi
          cat > notes.md <<EOF
          Linux x86_64 binaries of commit ${GITHUB_SHA} (llama-server, llama-perplexity, llama-inkling-pass-kv and the kernel tests), built for CUDA 12.8, sm_86 and sm_89.

          Image: \`${IMAGE}@${{ needs.image.outputs.digest }}\`

          Run: \`LD_LIBRARY_PATH=./lib ./llama-server -m Inkling-2-Mini-UD-Q3_K_XL.gguf ...\`. Needs NVIDIA driver >= 570 and the CUDA 12.8 runtime libraries (cudart, cuBLAS), which are not bundled; or use the image. See the README for the full command line.
          EOF
          gh release create "$tag" "$NAME.tar.gz" "$NAME.tar.gz.sha256" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
